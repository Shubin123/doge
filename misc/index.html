<!DOCTYPE html>
<html>
<head>
<style>
body{margin:0;background:#000;overflow:hidden;font-family:Arial}
canvas{display:block}
#ui{position:absolute;top:10px;left:10px;color:#fff;z-index:10}
button{margin:5px;padding:8px;background:#333;color:#fff;border:none;cursor:pointer}
</style>
</head>
<body>
<div id="ui">
<div>Score: <span id="score">0</span> | Lives: <span id="lives">3</span></div>
<div>Controls: WASD/Arrows + Space | P2: IJKL + K</div>
<button onclick="addBot()">Add Bot</button>
<button onclick="toggleMultiplayer()">Toggle Multiplayer</button>
<div>Players: <span id="players">1</span></div>
</div>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
c.width=innerWidth;c.height=innerHeight;
let score=0,lives=3,multiplayer=false,players=[],bots=[],bullets=[],asteroids=[];
const keys={};

class Entity{
constructor(x,y,r,vx=0,vy=0,color='#fff'){
this.x=x;this.y=y;this.r=r;this.vx=vx;this.vy=vy;this.color=color;this.angle=0;
}
update(){
this.x+=this.vx;this.y+=this.vy;
this.x=(this.x+c.width)%c.width;
this.y=(this.y+c.height)%c.height;
}
draw(){
ctx.save();
ctx.translate(this.x,this.y);
ctx.rotate(this.angle);
ctx.fillStyle=this.color;
ctx.fillRect(-this.r/2,-this.r/2,this.r,this.r);
ctx.restore();
}
}

class Player extends Entity{
constructor(x,y,id){
super(x,y,15,0,0,id?'#0f0':'#fff');
this.id=id||0;this.thrust=0.4;this.turnSpeed=0.15;this.shootCooldown=0;this.maxSpeed=8;
}
update(){
if(this.id===0){
if(keys.ArrowLeft||keys.KeyA)this.angle-=this.turnSpeed;
if(keys.ArrowRight||keys.KeyD)this.angle+=this.turnSpeed;
if(keys.ArrowUp||keys.KeyW){
this.vx+=Math.cos(this.angle)*this.thrust;
this.vy+=Math.sin(this.angle)*this.thrust;
}
if(keys.ArrowDown||keys.KeyS){
this.vx-=Math.cos(this.angle)*this.thrust*0.5;
this.vy-=Math.sin(this.angle)*this.thrust*0.5;
}
if(keys.Space&&this.shootCooldown<=0)this.shoot();
}else if(multiplayer){
if(keys.KeyJ)this.angle-=this.turnSpeed;
if(keys.KeyL)this.angle+=this.turnSpeed;
if(keys.KeyI){
this.vx+=Math.cos(this.angle)*this.thrust;
this.vy+=Math.sin(this.angle)*this.thrust;
}
if(keys.KeyK&&this.shootCooldown<=0)this.shoot();
}
// Speed limiting
const speed=Math.sqrt(this.vx*this.vx+this.vy*this.vy);
if(speed>this.maxSpeed){
this.vx=(this.vx/speed)*this.maxSpeed;
this.vy=(this.vy/speed)*this.maxSpeed;
}
this.vx*=0.98;this.vy*=0.98;
this.shootCooldown--;
super.update();
}
shoot(){
bullets.push(new Entity(this.x+Math.cos(this.angle)*20,this.y+Math.sin(this.angle)*20,3,
this.vx+Math.cos(this.angle)*12,this.vy+Math.sin(this.angle)*12,'#ff0'));
this.shootCooldown=8;
}
}

class Bot extends Player{
constructor(x,y){
super(x,y,Math.random()*999|0);
this.color='#f0f';this.target=null;this.actionTimer=0;
}
update(){
this.actionTimer--;
if(this.actionTimer<=0){
this.target=asteroids.length?asteroids[Math.random()*asteroids.length|0]:null;
this.actionTimer=60;
}
if(this.target){
const dx=this.target.x-this.x,dy=this.target.y-this.y;
const targetAngle=Math.atan2(dy,dx);
let angleDiff=targetAngle-this.angle;
while(angleDiff>Math.PI)angleDiff-=2*Math.PI;
while(angleDiff<-Math.PI)angleDiff+=2*Math.PI;
if(Math.abs(angleDiff)>0.1)this.angle+=Math.sign(angleDiff)*this.turnSpeed;
if(Math.abs(angleDiff)<0.5){
this.vx+=Math.cos(this.angle)*this.thrust;
this.vy+=Math.sin(this.angle)*this.thrust;
if(Math.random()<0.1)this.shoot();
}
}
this.vx*=0.99;this.vy*=0.99;
this.shootCooldown--;
super.update();
}
}

function createAsteroid(x=Math.random()*c.width,y=Math.random()*c.height,size=30){
const vx=(Math.random()-0.5)*4,vy=(Math.random()-0.5)*4;
asteroids.push(new Entity(x,y,size,vx,vy,'#888'));
}

function addBot(){
bots.push(new Bot(Math.random()*c.width,Math.random()*c.height));
updateUI();
}

function toggleMultiplayer(){
multiplayer=!multiplayer;
if(multiplayer&&players.length<2){
players.push(new Player(c.width/2+100,c.height/2,1));
}else if(!multiplayer&&players.length>1){
players.pop();
}
updateUI();
}

function updateUI(){
document.getElementById('score').textContent=score;
document.getElementById('lives').textContent=lives;
document.getElementById('players').textContent=players.length+bots.length;
}

function checkCollision(a,b){
const dx=a.x-b.x,dy=a.y-b.y;
return Math.sqrt(dx*dx+dy*dy)<a.r+b.r;
}

function gameLoop(){
ctx.fillStyle='rgba(0,0,0,0.1)';
ctx.fillRect(0,0,c.width,c.height);

// Update entities
[...players,...bots].forEach(p=>p.update());
bullets.forEach(b=>b.update());
asteroids.forEach(a=>a.update());

// Collision detection
bullets.forEach((b,bi)=>{
asteroids.forEach((a,ai)=>{
if(checkCollision(b,a)){
bullets.splice(bi,1);
asteroids.splice(ai,1);
score+=10;
if(a.r>15){
createAsteroid(a.x,a.y,a.r/2);
createAsteroid(a.x,a.y,a.r/2);
}
}
});
});

[...players,...bots].forEach(p=>{
asteroids.forEach(a=>{
if(checkCollision(p,a)){
lives--;
if(lives<=0)location.reload();
}
});
});

// Clean up bullets
bullets=bullets.filter(b=>b.x>-50&&b.x<c.width+50&&b.y>-50&&b.y<c.height+50);

// Spawn asteroids
if(asteroids.length<5)createAsteroid();

// Draw everything
[...players,...bots,...bullets,...asteroids].forEach(e=>e.draw());

updateUI();
requestAnimationFrame(gameLoop);
}

// Event listeners
addEventListener('keydown',e=>{keys[e.code]=true;e.preventDefault()});
addEventListener('keyup',e=>{keys[e.code]=false});
addEventListener('resize',()=>{c.width=innerWidth;c.height=innerHeight});

// Initialize
players.push(new Player(c.width/2,c.height/2));
for(let i=0;i<3;i++)createAsteroid();
gameLoop();
</script>
</body>
</html>
