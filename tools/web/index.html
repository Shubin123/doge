<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, minimum-scale=1, maximum-scale=1">
    <title>doge</title>
    <link rel="icon" href="favicon.ico">

    <!-- Load custom style sheet -->
    <link rel="stylesheet" type="text/css" href="theme/love.css">
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; } body { min-width: 320px; min-height: 100vh; margin: 0; background: #07111f; color: #eaf3ff; } .shell { width: min(100% - 32px, 1180px); margin: 0 auto; padding: 22px 0 26px; } .topbar, .control-panel, .control-group, .brand, .engine-status { display: flex; align-items: center; } .topbar { justify-content: space-between; gap: 16px; padding: 0 2px 18px; } .brand { gap: 11px; letter-spacing: .14em; text-transform: uppercase; } .brand-mark { display: grid; place-items: center; width: 30px; height: 30px; border: 1px solid #ffb449; border-radius: 8px; background: linear-gradient(135deg, #ffbc4d, #e46c27); color: #201003; font-weight: 900; letter-spacing: 0; } .brand-name { font-size: .98rem; font-weight: 800; } .brand-build, .engine-status, .browser-message, footer { color: #91a6bf; font-size: .78rem; font-weight: 650; } .engine-status { gap: 8px; } .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #f5ae45; box-shadow: 0 0 0 4px rgb(245 174 69 / 13%); } .status-dot.ready { background: #51d094; box-shadow: 0 0 0 4px rgb(81 208 148 / 13%); } .game-card { overflow: hidden; border: 1px solid #263d59; border-radius: 14px; background: #0a1728; box-shadow: 0 18px 55px rgb(0 0 0 / 36%); } .canvas-wrap { display: grid; min-height: min(70vw, 600px); place-items: center; overflow: hidden; background: #050c15; } #loadingCanvas, #canvas { display: block; max-width: 100%; height: auto; border: 0; outline: 0; } #canvas { visibility: hidden; touch-action: none; } .control-panel { justify-content: space-between; gap: 14px; flex-wrap: wrap; padding: 13px 14px; border-top: 1px solid #263d59; background: #0d1c30; } .control-group { gap: 8px; flex-wrap: wrap; } button { min-height: 36px; padding: 0 11px; border: 1px solid #365270; border-radius: 8px; background: #132942; color: #eaf3ff; cursor: pointer; font: inherit; font-size: .78rem; font-weight: 720; transition: border-color .15s, background .15s, transform .15s; } button:hover { border-color: #6b94bc; background: #1a3655; } button:active { transform: translateY(1px); } button:focus-visible { outline: 3px solid rgb(255 180 73 / 48%); outline-offset: 2px; } button.is-active { border-color: #4fd090; background: #123c38; color: #d8ffeb; } button.danger { border-color: #6d5560; background: #2c202a; color: #ffd9e2; } .play-help { margin: 0; color: #91a6bf; font-size: .74rem; line-height: 1.6; } kbd { padding: 2px 5px; border: 1px solid #405b77; border-bottom-width: 2px; border-radius: 4px; background: #11263e; color: #d5e6f6; font: 650 .68rem ui-monospace, monospace; } .browser-message { min-height: 1.25em; margin: 12px 2px 0; } footer { position: static; margin: 18px 2px 0; padding: 0; font-family: inherit; } body { background-image: none; } footer p { margin: 0; } footer a { color: #9fcfff; } @media (max-width: 640px) { .shell { width: min(100% - 20px, 1180px); padding-top: 14px; } .brand-build { display: none; } .canvas-wrap { min-height: calc((100vw - 20px) * .75); } button { flex: 1 1 auto; } .play-help { width: 100%; } }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand" aria-label="Doge web edition"><span class="brand-mark" aria-hidden="true">D</span><span class="brand-name">Doge</span><span class="brand-build">WebGL edition</span></div>
        <div class="engine-status" aria-live="polite"><span id="statusDot" class="status-dot" aria-hidden="true"></span><span id="engineStatus">Loading engine</span></div>
      </header>
      <section class="game-card" aria-label="Doge game">
        <div class="canvas-wrap"><canvas id="loadingCanvas" oncontextmenu="event.preventDefault()" width="800" height="600"></canvas><canvas id="canvas" tabindex="0" aria-label="Doge game canvas" oncontextmenu="event.preventDefault()"></canvas></div>
        <div class="control-panel" aria-label="Browser game controls">
          <div class="control-group"><button id="fullscreenButton" type="button">Fullscreen</button><button id="soundButton" class="is-active" type="button" aria-pressed="true">Sound: On</button><button id="lightsButton" class="is-active" type="button" aria-pressed="true">Lights: On</button><button id="menuButton" type="button" aria-pressed="false">Menu</button><button id="cacheButton" class="danger" type="button">Clear cached build</button></div>
          <p class="play-help"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move &nbsp; <kbd>Space</kbd> dodge &nbsp; Mouse to aim/fire &nbsp; <kbd>Esc</kbd> menu</p>
        </div>
      </section>
      <p id="browserMessage" class="browser-message" role="status">Preparing WebGL…</p>
      <footer><p>Built with <a href="https://github.com/Davidobot/love.js">love.js</a>. If a new build does not load, clear the cached build and reload.</p></footer>
    </main>

    <script type='text/javascript'>
      var gameCanvas = document.getElementById('canvas');
      var engineStatus = document.getElementById('engineStatus');
      var statusDot = document.getElementById('statusDot');
      var browserMessage = document.getElementById('browserMessage');

      function setBrowserStatus(message, ready) {
        engineStatus.textContent = message;
        browserMessage.textContent = message;
        statusDot.classList.toggle('ready', Boolean(ready));
      }

      function goFullScreen(){
        var request = gameCanvas.requestFullscreen || gameCanvas.webkitRequestFullscreen || gameCanvas.mozRequestFullScreen;
        if (request) request.call(gameCanvas);
      }
      function FullScreenHook(){
        var canvas = gameCanvas;
        canvas.width = window.innerWidth || document.documentElement.clientWidth || document.body.clientWidth;
        canvas.height = window.innerHeight || document.documentElement.clientHeight || document.body.clientHeight;
      }
      var loadingContext = document.getElementById('loadingCanvas').getContext('2d');
      function drawLoadingText(text) {
        var canvas = loadingContext.canvas;
        var width = canvas.width;
        var height = canvas.height;
        var centerX = width / 2;
        var centerY = height / 2;

        var background = loadingContext.createLinearGradient(0, 0, width, height);
        background.addColorStop(0, '#06101e');
        background.addColorStop(0.55, '#0b2440');
        background.addColorStop(1, '#170e2d');
        loadingContext.fillStyle = background;
        loadingContext.fillRect(0, 0, width, height);

        loadingContext.save();
        loadingContext.strokeStyle = 'rgba(79, 186, 255, 0.13)';
        loadingContext.lineWidth = 1;
        for (var x = -height; x < width + height; x += 38) {
          loadingContext.beginPath();
          loadingContext.moveTo(x, 0);
          loadingContext.lineTo(x + height, height);
          loadingContext.stroke();
        }
        loadingContext.restore();

        var glow = loadingContext.createRadialGradient(centerX, centerY - 20, 4, centerX, centerY - 20, 230);
        glow.addColorStop(0, 'rgba(38, 215, 255, 0.34)');
        glow.addColorStop(0.42, 'rgba(118, 67, 255, 0.13)');
        glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
        loadingContext.fillStyle = glow;
        loadingContext.fillRect(0, 0, width, height);

        loadingContext.textAlign = 'center';
        loadingContext.textBaseline = 'middle';
        loadingContext.shadowColor = '#36d6ff';
        loadingContext.shadowBlur = 22;
        loadingContext.fillStyle = '#eaf8ff';
        loadingContext.font = '800 68px system-ui, sans-serif';
        loadingContext.fillText('DOGE', centerX, centerY - 56);
        loadingContext.shadowBlur = 0;
        loadingContext.fillStyle = '#ffb34f';
        loadingContext.font = '700 15px system-ui, sans-serif';
        loadingContext.fillText('NEON COMBAT RUNTIME', centerX, centerY - 8);

        loadingContext.fillStyle = 'rgba(255,255,255,0.12)';
        loadingContext.fillRect(centerX - 150, centerY + 46, 300, 4);
        loadingContext.fillStyle = '#43d7ff';
        loadingContext.fillRect(centerX - 150, centerY + 46, 184, 4);
        loadingContext.fillStyle = '#c9deef';
        loadingContext.font = '600 15px system-ui, sans-serif';
        loadingContext.fillText(text || 'Preparing mission…', centerX, centerY + 82);

        loadingContext.strokeStyle = 'rgba(255, 179, 79, 0.8)';
        loadingContext.lineWidth = 2;
        loadingContext.strokeRect(22, 22, width - 44, height - 44);
      }

      window.onload = function () { window.focus(); };
      window.onclick = function () { window.focus(); };

      window.addEventListener("keydown", function(e) {
        // space and arrow keys
        if([32, 37, 38, 39, 40].indexOf(e.keyCode) > -1) {
          e.preventDefault();
        }
      }, false);

      function clearGameCache() {
        try {
          indexedDB.deleteDatabase('/doge/game.data');
          indexedDB.deleteDatabase('game.data');
          indexedDB.deleteDatabase('/game.data');
        } catch(e) {}
        localStorage.clear();
        location.reload(true);
      }

      function sendGameKey(key, code) {
        gameCanvas.focus({preventScroll: true});
        // Synthetic KeyboardEvents report keyCode=0 by default. SDL's
        // Emscripten bridge reads the legacy numeric code, so provide it as
        // well as the modern key/code values used by browsers.
        var keyCode = {Escape: 27, f: 70, m: 77}[key] || 0;
        ['keydown', 'keyup'].forEach(function(type) {
          var event = new KeyboardEvent(type, {key: key, code: code, bubbles: true});
          Object.defineProperties(event, {keyCode: {value: keyCode}, which: {value: keyCode}, charCode: {value: keyCode}});
          gameCanvas.dispatchEvent(event);
        });
      }

      function setToggle(button, active, label) {
        button.classList.toggle('is-active', active);
        button.setAttribute('aria-pressed', String(active));
        button.textContent = label + ': ' + (active ? 'On' : 'Off');
      }

      function bindGameToggle(id, key, code, label, initialState) {
        var button = document.getElementById(id);
        var active = initialState;
        setToggle(button, active, label);
        button.addEventListener('click', function() {
          active = !active;
          sendGameKey(key, code);
          setToggle(button, active, label);
        });
      }

      // LÖVE reports a boot failure (a Lua error before the window exists)
      // only as a bare alert() while the real error goes to the console.
      // Keep the recent engine errors and show them on the page instead.
      var recentErrors = [];
      function rememberError(text) {
        recentErrors.push(String(text));
        if (recentErrors.length > 12) recentErrors.shift();
      }
      window.alert = function(message) {
        var detail = recentErrors.filter(function(line) { return line.trim(); }).slice(-6).join('\n');
        console.error('[engine alert] ' + message + (detail ? '\n' + detail : ''));
        setBrowserStatus('Engine failed to start', false);
        browserMessage.style.whiteSpace = 'pre-wrap';
        browserMessage.style.color = '#ffb4c2';
        browserMessage.textContent = message + (detail ? '\n\n' + detail : '') +
          '\n\nTry "Clear cached build" and reload. If it persists, report this text with your browser/version.';
      };

      var Module = {
        arguments: ["./game.love"],
        INITIAL_MEMORY: __LOVEJS_MEMORY__,
        locateFile: function(path, prefix) {
          return (prefix || '') + path + '?v=__CACHE_BUST__';
        },
        print: function(text) { console.log(text); if (/error|traceback|\.lua:\d+/i.test(text)) rememberError(text); },
        printErr: function(text) { rememberError(text); console.error(text); },
        canvas: (function() {
          var canvas = gameCanvas;

          // As a default initial behavior, pop up an alert when webgl context is lost.
          canvas.addEventListener("webglcontextlost", function(e) { alert('WebGL context lost. You will need to reload the page.'); e.preventDefault(); }, false);

          return canvas;
        })(),
        setStatus: function(text) {
          if (text) {
            drawLoadingText(text);
            setBrowserStatus(text, false);
          } else if (Module.remainingDependencies === 0) {
            document.getElementById('loadingCanvas').style.display = 'none';
            document.getElementById('canvas').style.visibility = 'visible';
            setBrowserStatus('Engine ready', true);
          }
        },
        totalDependencies: 0,
        remainingDependencies: 0,
        monitorRunDependencies: function(left) {
          this.remainingDependencies = left;
          this.totalDependencies = Math.max(this.totalDependencies, left);
          Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
        }
      };
      Module.setStatus('Downloading...');
      window.onerror = function(event) {
        setBrowserStatus('Engine error — check the browser console', false);
        Module.setStatus('Exception thrown, see JavaScript console');
        Module.setStatus = function(text) {
          if (text) Module.printErr('[post-exception status] ' + text);
        };
      };

      var applicationLoad = function(e) {
        setBrowserStatus('Starting engine…', false);
        Love(Module);
      };

      document.getElementById('fullscreenButton').addEventListener('click', goFullScreen);
      document.getElementById('cacheButton').addEventListener('click', clearGameCache);
      bindGameToggle('soundButton', 'm', 'KeyM', 'Sound', true);
      bindGameToggle('lightsButton', 'f', 'KeyF', 'Lights', true);
      bindGameToggle('menuButton', 'Escape', 'Escape', 'Menu', false);
      document.addEventListener('fullscreenchange', function() {
        document.getElementById('fullscreenButton').textContent = document.fullscreenElement ? 'Exit fullscreen' : 'Fullscreen';
      });
    </script>
    <script type="text/javascript">
      // Capability gate. The sprite atlas ships as one 16384x16384 BC3/DXT5
      // (S3TC) texture. GPU vendors expose different compressed formats:
      // desktop Windows/macOS/Linux drivers normally offer S3TC, mobile GPUs
      // mostly offer only ETC2/ASTC, and older iGPUs cap textures at 8192.
      // Check before downloading ~50 MB and say exactly what is missing,
      // rather than failing inside the engine with a black screen.
      (function() {
        var caps = {webgl: false, s3tc: false, maxTexture: 0, renderer: 'unknown', vendor: 'unknown'};
        try {
          var gl = document.createElement('canvas').getContext('webgl');
          if (gl) {
            caps.webgl = true;
            caps.s3tc = !!(gl.getExtension('WEBGL_compressed_texture_s3tc') ||
                           gl.getExtension('MOZ_WEBGL_compressed_texture_s3tc') ||
                           gl.getExtension('WEBKIT_WEBGL_compressed_texture_s3tc'));
            caps.maxTexture = gl.getParameter(gl.MAX_TEXTURE_SIZE) || 0;
            var dbg = gl.getExtension('WEBGL_debug_renderer_info');
            caps.renderer = String(dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER));
            caps.vendor = String(dbg ? gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL) : gl.getParameter(gl.VENDOR));
            var lose = gl.getExtension('WEBGL_lose_context');
            if (lose) lose.loseContext();
          }
        } catch (e) {}
        window.__doge_caps = caps;
        console.log('GPU caps: ' + JSON.stringify(caps));

        var problems = [];
        if (!caps.webgl) problems.push('WebGL is unavailable (disabled, blocklisted driver, or hardware acceleration off).');
        else {
          if (!caps.s3tc) problems.push('This GPU/browser does not expose S3TC (DXT5) texture compression, which the sprite atlas uses. Mobile GPUs usually only offer ETC2/ASTC.');
          if (caps.maxTexture < 16384) problems.push('Max texture size is ' + caps.maxTexture + ', but the sprite atlas is 16384x16384.');
        }
        if (problems.length) {
          console.error('[unsupported] ' + problems.join(' '));
          setBrowserStatus('Unsupported GPU', false);
          browserMessage.style.whiteSpace = 'pre-wrap';
          browserMessage.style.color = '#ffb4c2';
          browserMessage.textContent = 'This device cannot run the web build:\n- ' + problems.join('\n- ') +
            '\n\nGPU: ' + caps.vendor + ' / ' + caps.renderer +
            '\nTry desktop Chrome, Edge or Firefox with hardware acceleration on, or a native build.';
          drawLoadingText('Unsupported GPU');
          return;
        }

        function load(src, onload) {
          var tag = document.createElement('script');
          tag.src = src; tag.async = false;
          if (onload) tag.onload = onload;
          document.body.appendChild(tag);
        }
        load('game.js?v=__CACHE_BUST__');
        load('love.js?v=__CACHE_BUST__', applicationLoad);
      })();
    </script>
  </body>
</html>
